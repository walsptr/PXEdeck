# Preseed dibuat PXE dashboard (jangan edit manual)
d-i debian-installer/locale string en_US
d-i debian-installer/language string en
d-i keyboard-configuration/xkb-keymap select us
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string m4-node11
d-i netcfg/get_domain string
d-i netcfg/hostname string m4-node11
d-i mirror/country string manual
d-i mirror/http/hostname string 10.99.0.2
d-i mirror/http/directory string /media/debian-12
d-i mirror/http/proxy string
d-i mirror/suite string bookworm
d-i debian-installer/allow_unauthenticated boolean true
d-i apt-setup/services-select multiselect
d-i apt-setup/non-free-firmware boolean false
d-i apt-setup/cdrom/set-first boolean false
d-i passwd/root-login boolean false
d-i passwd/user-fullname string ops
d-i passwd/username string ops
d-i passwd/user-password-crypted password $6$fixturesalt$AbCdEfGhIjKlMnOpQrStUvWxYz0123456789./AbCdEfGhIjKlMnOpQrStUvWxYz0123456789./AbCdEfGhIj
d-i clock-setup/utc boolean true
d-i time/zone string Asia/Jakarta
d-i clock-setup/ntp boolean false
d-i partman-auto/disk string /dev/vda
d-i partman-auto/method string lvm
d-i partman-auto-lvm/guided_size string max
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-md/device_remove_md boolean true
d-i partman-lvm/confirm boolean true
d-i partman-lvm/confirm_nooverwrite boolean true
d-i partman-auto/choose_recipe select atomic
d-i partman-efi/non_efi_system boolean true
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true
d-i tasksel/first multiselect standard, ssh-server
d-i pkgsel/include string openssh-server curl sudo
d-i pkgsel/upgrade select none
d-i popularity-contest/popularity-contest boolean false
d-i grub-installer/only_debian boolean true
d-i grub-installer/bootdev string /dev/vda
d-i preseed/late_command string in-target sh -c 'echo  | base64 -d > /tmp/pxe-late.sh && sh /tmp/pxe-late.sh; rm -f /tmp/pxe-late.sh'
d-i finish-install/reboot_in_progress note
