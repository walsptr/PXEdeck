repo --name=AppStream --baseurl=http://10.99.0.2/media/rocky-9/AppStream
lang en_US.UTF-8
keyboard --vckeymap=us --xlayouts=us
timezone Asia/Jakarta --utc
network --device=52:54:00:99:00:11 --bootproto=static --ip=10.99.0.21 --netmask=255.255.255.0 --gateway=10.99.0.1 --nameserver=10.99.0.2 --hostname=m4-node11 --activate --onboot=yes
rootpw --lock
user --name=ops --password=$6$fixturesalt$AbCdEfGhIjKlMnOpQrStUvWxYz0123456789./AbCdEfGhIjKlMnOpQrStUvWxYz0123456789./AbCdEfGhIj --iscrypted --groups=wheel
sshkey --username=ops "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIC7woJ7Ei1SHKHfK8Q8iGXm2/B2KDYvzsi3GFzSPyB+D fixture-ed25519@test"
