# Kickstart dibuat PXE dashboard (jangan edit manual)
cmdline
url --url=http://10.99.0.2/media/rocky-9
lang en_US.UTF-8
keyboard --vckeymap=us --xlayouts=us
timezone Asia/Jakarta --utc
network --device=52:54:00:99:00:11 --bootproto=static --ip=10.99.0.21 --netmask=255.255.255.0 --gateway=10.99.0.1 --nameserver=10.99.0.2 --hostname=m4-node11 --activate --onboot=yes
rootpw --lock
user --name=ops --password=$6$fixturesalt$AbCdEfGhIjKlMnOpQrStUvWxYz0123456789./AbCdEfGhIjKlMnOpQrStUvWxYz0123456789./AbCdEfGhIj --iscrypted --groups=wheel
sshkey --username=ops "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIC7woJ7Ei1SHKHfK8Q8iGXm2/B2KDYvzsi3GFzSPyB+D fixture-ed25519@test"
sshkey --username=ops "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAICU1HfR4aSJlSMWzsLTx5GJ+eXSZtieyKq7UvPVkuonr fixture-ed25519-b@test"
firstboot --disable
selinux --enforcing
firewall --enabled --ssh
ignoredisk --only-use=vda
clearpart --all --initlabel --drives=vda
zerombr
autopart --type=lvm
bootloader --location=mbr
reboot

%pre --erroronfail
b=$(tr ' ' '\n' < /proc/cmdline | sed -n 's#^inst\.ks=\(https\{0,1\}://.*/boot/52:54:00:99:00:11/[A-Za-z0-9_-]\{43\}/\)[^/]*$#\1#p' | head -n 1); if [ -n "$b" ]; then printf '%s\n' 'installer: kickstart mulai' | curl -fsS -m 15 --data-binary @- -H 'Content-Type: text/plain' "${b}log" >/dev/null 2>&1 || wget -q -T 15 -O /dev/null --header='Content-Type: text/plain' --post-data='installer: kickstart mulai' "${b}log" >/dev/null 2>&1 || true; fi
p='/dev/vda'
if [ -z "$p" ]; then n=$(lsblk -dnro NAME,TYPE,RM | awk '$2 == "disk" && $3 == "0" && $1 !~ /^(zram|loop)/ {print $1; exit}'); [ -n "$n" ] && p=/dev/$n; fi
if [ -n "$p" ] && [ -b "$p" ]; then
  b=$(tr ' ' '\n' < /proc/cmdline | sed -n 's#^inst\.ks=\(https\{0,1\}://.*/boot/52:54:00:99:00:11/[A-Za-z0-9_-]\{43\}/\)[^/]*$#\1#p' | head -n 1); if [ -n "$b" ]; then printf '%s\n' 'installer: disk target dipilih' | curl -fsS -m 15 --data-binary @- -H 'Content-Type: text/plain' "${b}log" >/dev/null 2>&1 || wget -q -T 15 -O /dev/null --header='Content-Type: text/plain' --post-data='installer: disk target dipilih' "${b}log" >/dev/null 2>&1 || true; fi
else
  b=$(tr ' ' '\n' < /proc/cmdline | sed -n 's#^inst\.ks=\(https\{0,1\}://.*/boot/52:54:00:99:00:11/[A-Za-z0-9_-]\{43\}/\)[^/]*$#\1#p' | head -n 1); if [ -n "$b" ]; then printf '%s\n' 'ERROR installer gagal: disk target tidak ditemukan' | curl -fsS -m 15 --data-binary @- -H 'Content-Type: text/plain' "${b}log" >/dev/null 2>&1 || wget -q -T 15 -O /dev/null --header='Content-Type: text/plain' --post-data='ERROR installer gagal: disk target tidak ditemukan' "${b}log" >/dev/null 2>&1 || true; fi
  b=$(tr ' ' '\n' < /proc/cmdline | sed -n 's#^inst\.ks=\(https\{0,1\}://.*/boot/52:54:00:99:00:11/[A-Za-z0-9_-]\{43\}/\)[^/]*$#\1#p' | head -n 1); if [ -n "$b" ]; then for f in /tmp/anaconda.log /tmp/program.log; do [ -f "$f" ] && { printf 'ERROR installer gagal: %s\n' "$f"; tail -n 60 "$f" | cut -c1-240; } | curl -fsS -m 15 --data-binary @- -H 'Content-Type: text/plain' "${b}log" >/dev/null 2>&1; done; fi; true
  u=$(tr ' ' '\n' < /proc/cmdline | sed -n 's#^inst\.ks=\(https\{0,1\}://.*/boot/52:54:00:99:00:11/[A-Za-z0-9_-]\{43\}/\)[^/]*$#\1status#p' | head -n 1); curl -fsS -m 15 --retry 5 --retry-delay 3 -X POST -d stage=failed "$u" >/dev/null 2>&1 || wget -q -T 15 -O /dev/null --post-data=stage=failed "$u" || true
  exit 1
fi
%end

%packages
@^minimal-environment
openssh-server
curl
sudo
%end

%post --log=/root/pxe-post.log
echo  | base64 -d > /tmp/pxe-post.sh && sh /tmp/pxe-post.sh; rm -f /tmp/pxe-post.sh
%end

%onerror
b=$(tr ' ' '\n' < /proc/cmdline | sed -n 's#^inst\.ks=\(https\{0,1\}://.*/boot/52:54:00:99:00:11/[A-Za-z0-9_-]\{43\}/\)[^/]*$#\1#p' | head -n 1); if [ -n "$b" ]; then for f in /tmp/anaconda.log /tmp/program.log; do [ -f "$f" ] && { printf 'ERROR installer gagal: %s\n' "$f"; tail -n 60 "$f" | cut -c1-240; } | curl -fsS -m 15 --data-binary @- -H 'Content-Type: text/plain' "${b}log" >/dev/null 2>&1; done; fi; true
u=$(tr ' ' '\n' < /proc/cmdline | sed -n 's#^inst\.ks=\(https\{0,1\}://.*/boot/52:54:00:99:00:11/[A-Za-z0-9_-]\{43\}/\)[^/]*$#\1status#p' | head -n 1); curl -fsS -m 15 --retry 5 --retry-delay 3 -X POST -d stage=failed "$u" >/dev/null 2>&1 || wget -q -T 15 -O /dev/null --post-data=stage=failed "$u" || true
%end
