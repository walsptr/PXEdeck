%packages
@^minimal-environment
curl
%end

%post --log=/root/pxe-post.log
echo  | base64 -d > /tmp/pxe-post.sh && sh /tmp/pxe-post.sh; rm -f /tmp/pxe-post.sh
%end

%onerror
u=$(tr ' ' '\n' < /proc/cmdline | sed -n 's#^inst\.ks=\(https\{0,1\}://.*/boot/52:54:00:99:00:11/[A-Za-z0-9_-]\{43\}/\)[^/]*$#\1status#p' | head -n 1); curl -fsS -m 15 --retry 5 --retry-delay 3 -X POST -d stage=failed "$u" >/dev/null 2>&1 || wget -q -T 15 -O /dev/null --post-data=stage=failed "$u" || true
%end
