#cloud-config
autoinstall:
  version: 1
  locale: en_US.UTF-8
  keyboard:
    layout: us
  timezone: Asia/Jakarta
  refresh-installer:
    update: false
  apt:
    geoip: false
    fallback: offline-install
  network:
    version: 2
    ethernets:
      mgmt:
        match:
          macaddress: 52:54:00:99:00:41
        dhcp4: false
        dhcp6: false
    vlans:
      mgmt.20:
        id: 20
        link: mgmt
        dhcp4: false
        dhcp6: false
        addresses:
          - 10.99.20.41/24
        routes:
          - to: default
            via: 10.99.20.1
        nameservers:
          addresses:
            - 10.99.10.2
  identity:
    hostname: m7-node41
    username: ops
    password: $6$fixturesalt$AbCdEfGhIjKlMnOpQrStUvWxYz0123456789./AbCdEfGhIjKlMnOpQrStUvWxYz0123456789./AbCdEfGhIj
  ssh:
    install-server: true
    allow-pw: false
    authorized-keys:
      - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIC7woJ7Ei1SHKHfK8Q8iGXm2/B2KDYvzsi3GFzSPyB+D fixture-ed25519@test
  storage:
    layout:
      name: lvm
      sizing-policy: all
      match:
        path: /dev/vda
  early-commands:
    - "b=$(tr ' ' '\\n' < /proc/cmdline | sed -n 's#^ds=nocloud-net;s=\\(https\\{0,1\\}://.*/boot/52:54:00:99:00:41/[A-Za-z0-9_-]\\{43\\}/\\)[^/]*$#\\1#p' | head -n 1); if [ -n \"$b\" ]; then printf '%s\\n' 'installer: autoinstall mulai' | curl -fsS -m 15 --data-binary @- -H 'Content-Type: text/plain' \"${b}log\" >/dev/null 2>&1 || wget -q -T 15 -O /dev/null --header='Content-Type: text/plain' --post-data='installer: autoinstall mulai' \"${b}log\" >/dev/null 2>&1 || true; fi"
  late-commands:
    - "b=$(tr ' ' '\\n' < /proc/cmdline | sed -n 's#^ds=nocloud-net;s=\\(https\\{0,1\\}://.*/boot/52:54:00:99:00:41/[A-Za-z0-9_-]\\{43\\}/\\)[^/]*$#\\1#p' | head -n 1); if [ -n \"$b\" ]; then printf '%s\\n' 'installer: late-commands mulai' | curl -fsS -m 15 --data-binary @- -H 'Content-Type: text/plain' \"${b}log\" >/dev/null 2>&1 || wget -q -T 15 -O /dev/null --header='Content-Type: text/plain' --post-data='installer: late-commands mulai' \"${b}log\" >/dev/null 2>&1 || true; fi"
    - u=$(tr ' ' '\n' < /proc/cmdline | sed -n 's#^ds=nocloud-net;s=\(https\{0,1\}://.*/boot/52:54:00:99:00:41/[A-Za-z0-9_-]\{43\}/\)[^/]*$#\1status#p' | head -n 1); curl -fsS -m 15 --retry 5 --retry-delay 3 -X POST -d stage=configuring "$u" >/dev/null 2>&1 || wget -q -T 15 -O /dev/null --post-data=stage=configuring "$u" || true
    - printf %s 'b3BzIEFMTD0oQUxMKSBOT1BBU1NXRDpBTEwK' | base64 -d > /target/etc/sudoers.d/90-ops && chmod 440 /target/etc/sudoers.d/90-ops
    - mkdir -p /target/etc/ssh/sshd_config.d
    - printf %s 'IyBEaXBhc2FuZyBQWEUgZGFzaGJvYXJkOiBsb2dpbiBoYW55YSBkZW5nYW4ga2V5ClBhc3N3b3JkQXV0aGVudGljYXRpb24gbm8KS2JkSW50ZXJhY3RpdmVBdXRoZW50aWNhdGlvbiBubwo=' | base64 -d > /target/etc/ssh/sshd_config.d/60-pxe-no-password.conf && chmod 644 /target/etc/ssh/sshd_config.d/60-pxe-no-password.conf
    - mkdir -p /target/etc/pxe-callback /target/usr/local/sbin /target/etc/systemd/system/multi-user.target.wants && chmod 700 /target/etc/pxe-callback
    - u=$(tr ' ' '\n' < /proc/cmdline | sed -n 's#^ds=nocloud-net;s=\(https\{0,1\}://.*/boot/52:54:00:99:00:41/[A-Za-z0-9_-]\{43\}/\)[^/]*$#\1status#p' | head -n 1); if [ -n "$u" ]; then (umask 077; printf '%s\n' "$u" > /target/etc/pxe-callback/url) && chmod 600 /target/etc/pxe-callback/url; fi
    - printf %s '' | base64 -d > /target/usr/local/sbin/pxe-callback-done && chmod 755 /target/usr/local/sbin/pxe-callback-done
    - printf %s '' | base64 -d > /target/etc/systemd/system/pxe-callback-done.service && chmod 644 /target/etc/systemd/system/pxe-callback-done.service
    - ln -sf /etc/systemd/system/pxe-callback-done.service /target/etc/systemd/system/multi-user.target.wants/pxe-callback-done.service
    - "b=$(tr ' ' '\\n' < /proc/cmdline | sed -n 's#^ds=nocloud-net;s=\\(https\\{0,1\\}://.*/boot/52:54:00:99:00:41/[A-Za-z0-9_-]\\{43\\}/\\)[^/]*$#\\1#p' | head -n 1); if [ -n \"$b\" ]; then printf '%s\\n' 'installer: konfigurasi target selesai' | curl -fsS -m 15 --data-binary @- -H 'Content-Type: text/plain' \"${b}log\" >/dev/null 2>&1 || wget -q -T 15 -O /dev/null --header='Content-Type: text/plain' --post-data='installer: konfigurasi target selesai' \"${b}log\" >/dev/null 2>&1 || true; fi"
    - |
      if [ -d /sys/firmware/efi ]; then
        n=$(efibootmgr | awk '/[Uu]buntu/ {print substr($1,5,4); exit}')
        o=$(efibootmgr | awk -F': ' '/^BootOrder/ {print $2}')
        if [ -n "$n" ]; then
          efibootmgr -o "$(echo "$n,$o" | tr ',' '\n' | awk '!s[$0]++' | paste -sd,)" || true
        fi
      fi
    - systemd-run --unit=pxe-force-reboot -p DefaultDependencies=no /bin/sh -c 'until [ "$(systemctl is-system-running)" = stopping ]; do sleep 2; done; sleep 45; echo s > /proc/sysrq-trigger; sleep 3; echo b > /proc/sysrq-trigger'
  error-commands:
    - "b=$(tr ' ' '\\n' < /proc/cmdline | sed -n 's#^ds=nocloud-net;s=\\(https\\{0,1\\}://.*/boot/52:54:00:99:00:41/[A-Za-z0-9_-]\\{43\\}/\\)[^/]*$#\\1#p' | head -n 1); if [ -n \"$b\" ]; then for f in /var/log/installer/subiquity-server-debug.log /var/log/curtin/install.log; do [ -f \"$f\" ] && { printf 'ERROR installer gagal: %s\\n' \"$f\"; tail -n 60 \"$f\" | cut -c1-240; } | curl -fsS -m 15 --data-binary @- -H 'Content-Type: text/plain' \"${b}log\" >/dev/null 2>&1; done; fi; true"
    - u=$(tr ' ' '\n' < /proc/cmdline | sed -n 's#^ds=nocloud-net;s=\(https\{0,1\}://.*/boot/52:54:00:99:00:41/[A-Za-z0-9_-]\{43\}/\)[^/]*$#\1status#p' | head -n 1); curl -fsS -m 15 --retry 5 --retry-delay 3 -X POST -d stage=failed "$u" >/dev/null 2>&1 || wget -q -T 15 -O /dev/null --post-data=stage=failed "$u" || true
  shutdown: reboot
