#cloud-config
autoinstall:
  version: 1
  locale: en_US.UTF-8
  keyboard:
    layout: us
  timezone: Asia/Jakarta
  refresh-installer:
    update: false
  apt:
    geoip: false
    fallback: offline-install
  network:
    version: 2
    ethernets:
      mgmt:
        match:
          macaddress: 52:54:00:99:00:11
        dhcp4: true
  identity:
    hostname: m4-node11
    username: ops
    password: $6$fixturesalt$AbCdEfGhIjKlMnOpQrStUvWxYz0123456789./AbCdEfGhIjKlMnOpQrStUvWxYz0123456789./AbCdEfGhIj
  ssh:
    install-server: true
    allow-pw: true
    authorized-keys:
      - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIC7woJ7Ei1SHKHfK8Q8iGXm2/B2KDYvzsi3GFzSPyB+D fixture-ed25519@test
      - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAICU1HfR4aSJlSMWzsLTx5GJ+eXSZtieyKq7UvPVkuonr fixture-ed25519-b@test
  storage:
    layout:
      name: direct
  late-commands:
    - curl -fsS -m 15 --retry 5 --retry-delay 3 -X POST -d stage=configuring 'http://10.99.0.2/boot/52:54:00:99:00:11/FIXTURE-token-not-real_0000000000000000000/status' >/dev/null 2>&1 || wget -q -T 15 -O /dev/null --post-data=stage=configuring 'http://10.99.0.2/boot/52:54:00:99:00:11/FIXTURE-token-not-real_0000000000000000000/status' || true
    - mkdir -p /target/etc/pxe-callback /target/usr/local/sbin /target/etc/systemd/system/multi-user.target.wants && chmod 700 /target/etc/pxe-callback
    - printf %s 'aHR0cDovLzEwLjk5LjAuMi9ib290LzUyOjU0OjAwOjk5OjAwOjExL0ZJWFRVUkUtdG9rZW4tbm90LXJlYWxfMDAwMDAwMDAwMDAwMDAwMDAwMC9zdGF0dXMK' | base64 -d > /target/etc/pxe-callback/url && chmod 600 /target/etc/pxe-callback/url
    - printf %s '' | base64 -d > /target/usr/local/sbin/pxe-callback-done && chmod 755 /target/usr/local/sbin/pxe-callback-done
    - printf %s '' | base64 -d > /target/etc/systemd/system/pxe-callback-done.service && chmod 644 /target/etc/systemd/system/pxe-callback-done.service
    - ln -sf /etc/systemd/system/pxe-callback-done.service /target/etc/systemd/system/multi-user.target.wants/pxe-callback-done.service
    - |
      if [ -d /sys/firmware/efi ]; then
        n=$(efibootmgr | awk '/[Uu]buntu/ {print substr($1,5,4); exit}')
        o=$(efibootmgr | awk -F': ' '/^BootOrder/ {print $2}')
        if [ -n "$n" ]; then
          efibootmgr -o "$(echo "$n,$o" | tr ',' '\n' | awk '!s[$0]++' | paste -sd,)" || true
        fi
      fi
    - systemd-run --unit=pxe-force-reboot -p DefaultDependencies=no /bin/sh -c 'until [ "$(systemctl is-system-running)" = stopping ]; do sleep 2; done; sleep 45; echo s > /proc/sysrq-trigger; sleep 3; echo b > /proc/sysrq-trigger'
  error-commands:
    - curl -fsS -m 15 --retry 5 --retry-delay 3 -X POST -d stage=failed 'http://10.99.0.2/boot/52:54:00:99:00:11/FIXTURE-token-not-real_0000000000000000000/status' >/dev/null 2>&1 || wget -q -T 15 -O /dev/null --post-data=stage=failed 'http://10.99.0.2/boot/52:54:00:99:00:11/FIXTURE-token-not-real_0000000000000000000/status' || true
  shutdown: reboot
