#cloud-config
autoinstall:
  version: 1
  locale: en_US.UTF-8
  keyboard:
    layout: us
  timezone: Asia/Jakarta
  refresh-installer:
    update: false
  apt:
    geoip: false
    fallback: offline-install
  network:
    version: 2
    ethernets:
      mgmt:
        match:
          macaddress: 52:54:00:99:00:11
        dhcp4: true
  identity:
    hostname: m4-node11
    username: ops
    password: $6$fixturesalt$AbCdEfGhIjKlMnOpQrStUvWxYz0123456789./AbCdEfGhIjKlMnOpQrStUvWxYz0123456789./AbCdEfGhIj
  ssh:
    install-server: true
    allow-pw: true
    authorized-keys:
      - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIC7woJ7Ei1SHKHfK8Q8iGXm2/B2KDYvzsi3GFzSPyB+D fixture-ed25519@test
      - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAICU1HfR4aSJlSMWzsLTx5GJ+eXSZtieyKq7UvPVkuonr fixture-ed25519-b@test
  storage:
    layout:
      name: direct
  early-commands:
    - "b=$(tr ' ' '\\n' < /proc/cmdline | sed -n 's#^ds=nocloud-net;s=\\(https\\{0,1\\}://.*/boot/52:54:00:99:00:11/[A-Za-z0-9_-]\\{43\\}/\\)[^/]*$#\\1#p' | head -n 1); if [ -n \"$b\" ]; then printf '%s\\n' 'installer: autoinstall mulai' | curl -fsS -m 15 --data-binary @- -H 'Content-Type: text/plain' \"${b}log\" >/dev/null 2>&1 || wget -q -T 15 -O /dev/null --header='Content-Type: text/plain' --post-data='installer: autoinstall mulai' \"${b}log\" >/dev/null 2>&1 || true; fi"
  late-commands:
    - "b=$(tr ' ' '\\n' < /proc/cmdline | sed -n 's#^ds=nocloud-net;s=\\(https\\{0,1\\}://.*/boot/52:54:00:99:00:11/[A-Za-z0-9_-]\\{43\\}/\\)[^/]*$#\\1#p' | head -n 1); if [ -n \"$b\" ]; then printf '%s\\n' 'installer: late-commands mulai' | curl -fsS -m 15 --data-binary @- -H 'Content-Type: text/plain' \"${b}log\" >/dev/null 2>&1 || wget -q -T 15 -O /dev/null --header='Content-Type: text/plain' --post-data='installer: late-commands mulai' \"${b}log\" >/dev/null 2>&1 || true; fi"
    - u=$(tr ' ' '\n' < /proc/cmdline | sed -n 's#^ds=nocloud-net;s=\(https\{0,1\}://.*/boot/52:54:00:99:00:11/[A-Za-z0-9_-]\{43\}/\)[^/]*$#\1status#p' | head -n 1); curl -fsS -m 15 --retry 5 --retry-delay 3 -X POST -d stage=configuring "$u" >/dev/null 2>&1 || wget -q -T 15 -O /dev/null --post-data=stage=configuring "$u" || true
    - mkdir -p /target/etc/pxe-callback /target/usr/local/sbin /target/etc/systemd/system/multi-user.target.wants && chmod 700 /target/etc/pxe-callback
    - u=$(tr ' ' '\n' < /proc/cmdline | sed -n 's#^ds=nocloud-net;s=\(https\{0,1\}://.*/boot/52:54:00:99:00:11/[A-Za-z0-9_-]\{43\}/\)[^/]*$#\1status#p' | head -n 1); if [ -n "$u" ]; then (umask 077; printf '%s\n' "$u" > /target/etc/pxe-callback/url) && chmod 600 /target/etc/pxe-callback/url; fi
    - printf %s '' | base64 -d > /target/usr/local/sbin/pxe-callback-done && chmod 755 /target/usr/local/sbin/pxe-callback-done
    - printf %s '' | base64 -d > /target/etc/systemd/system/pxe-callback-done.service && chmod 644 /target/etc/systemd/system/pxe-callback-done.service
    - ln -sf /etc/systemd/system/pxe-callback-done.service /target/etc/systemd/system/multi-user.target.wants/pxe-callback-done.service
    - "b=$(tr ' ' '\\n' < /proc/cmdline | sed -n 's#^ds=nocloud-net;s=\\(https\\{0,1\\}://.*/boot/52:54:00:99:00:11/[A-Za-z0-9_-]\\{43\\}/\\)[^/]*$#\\1#p' | head -n 1); if [ -n \"$b\" ]; then printf '%s\\n' 'installer: konfigurasi target selesai' | curl -fsS -m 15 --data-binary @- -H 'Content-Type: text/plain' \"${b}log\" >/dev/null 2>&1 || wget -q -T 15 -O /dev/null --header='Content-Type: text/plain' --post-data='installer: konfigurasi target selesai' \"${b}log\" >/dev/null 2>&1 || true; fi"
    - |
      if [ -d /sys/firmware/efi ]; then
        n=$(efibootmgr | awk '/[Uu]buntu/ {print substr($1,5,4); exit}')
        o=$(efibootmgr | awk -F': ' '/^BootOrder/ {print $2}')
        if [ -n "$n" ]; then
          efibootmgr -o "$(echo "$n,$o" | tr ',' '\n' | awk '!s[$0]++' | paste -sd,)" || true
        fi
      fi
    - systemd-run --unit=pxe-force-reboot -p DefaultDependencies=no /bin/sh -c 'until [ "$(systemctl is-system-running)" = stopping ]; do sleep 2; done; sleep 45; echo s > /proc/sysrq-trigger; sleep 3; echo b > /proc/sysrq-trigger'
  error-commands:
    - "b=$(tr ' ' '\\n' < /proc/cmdline | sed -n 's#^ds=nocloud-net;s=\\(https\\{0,1\\}://.*/boot/52:54:00:99:00:11/[A-Za-z0-9_-]\\{43\\}/\\)[^/]*$#\\1#p' | head -n 1); if [ -n \"$b\" ]; then for f in /var/log/installer/subiquity-server-debug.log /var/log/curtin/install.log; do [ -f \"$f\" ] && { printf 'ERROR installer gagal: %s\\n' \"$f\"; tail -n 60 \"$f\" | cut -c1-240; } | curl -fsS -m 15 --data-binary @- -H 'Content-Type: text/plain' \"${b}log\" >/dev/null 2>&1; done; fi; true"
    - u=$(tr ' ' '\n' < /proc/cmdline | sed -n 's#^ds=nocloud-net;s=\(https\{0,1\}://.*/boot/52:54:00:99:00:11/[A-Za-z0-9_-]\{43\}/\)[^/]*$#\1status#p' | head -n 1); curl -fsS -m 15 --retry 5 --retry-delay 3 -X POST -d stage=failed "$u" >/dev/null 2>&1 || wget -q -T 15 -O /dev/null --post-data=stage=failed "$u" || true
  shutdown: reboot
