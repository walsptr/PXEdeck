d-i partman/early_command string for m in virtio virtio_ring virtio_pci scsi_mod; do modprobe $m 2>/dev/null; done; for m in virtio_blk virtio_scsi; do [ -d "/sys/module/$m" ] || { wget -q -T 15 -O "/tmp/$m.ko" 'http://10.99.0.2/media/debian-netboot/modules'"/$(uname -r)/$m.ko" && insmod "/tmp/$m.ko"; }; done; udevadm settle --timeout=15 2>/dev/null || sleep 3; if [ -d /sys/module/virtio_blk ]; then b=$(tr ' ' '\n' < /proc/cmdline | sed -n 's#^url=\(https\{0,1\}://.*/boot/52:54:00:99:00:11/[A-Za-z0-9_-]\{43\}/\)[^/]*$#\1#p' | head -n 1); if [ -n "$b" ]; then printf '%s\n' 'installer: modul disk virtio dimuat' | curl -fsS -m 15 --data-binary @- -H 'Content-Type: text/plain' "${b}log" >/dev/null 2>&1 || wget -q -T 15 -O /dev/null --header='Content-Type: text/plain' --post-data='installer: modul disk virtio dimuat' "${b}log" >/dev/null 2>&1 || true; fi; fi; d=''; if [ -z "$d" ]; then for x in $(list-devices disk); do [ "$(cat "/sys/block/${x##*/}/removable" 2>/dev/null)" = 1 ] || { d=$x; break; }; done; fi; if [ -n "$d" ] && [ -b "$d" ]; then debconf-set partman-auto/disk "$d"; debconf-set grub-installer/bootdev "$d"; b=$(tr ' ' '\n' < /proc/cmdline | sed -n 's#^url=\(https\{0,1\}://.*/boot/52:54:00:99:00:11/[A-Za-z0-9_-]\{43\}/\)[^/]*$#\1#p' | head -n 1); if [ -n "$b" ]; then printf '%s\n' 'installer: disk target dipilih' | curl -fsS -m 15 --data-binary @- -H 'Content-Type: text/plain' "${b}log" >/dev/null 2>&1 || wget -q -T 15 -O /dev/null --header='Content-Type: text/plain' --post-data='installer: disk target dipilih' "${b}log" >/dev/null 2>&1 || true; fi; else b=$(tr ' ' '\n' < /proc/cmdline | sed -n 's#^url=\(https\{0,1\}://.*/boot/52:54:00:99:00:11/[A-Za-z0-9_-]\{43\}/\)[^/]*$#\1#p' | head -n 1); if [ -n "$b" ]; then printf '%s\n' 'ERROR installer gagal: disk target tidak ditemukan' | curl -fsS -m 15 --data-binary @- -H 'Content-Type: text/plain' "${b}log" >/dev/null 2>&1 || wget -q -T 15 -O /dev/null --header='Content-Type: text/plain' --post-data='ERROR installer gagal: disk target tidak ditemukan' "${b}log" >/dev/null 2>&1 || true; fi; { echo 'ERROR diagnosis disk d-i'; echo "kernel $(uname -r)"; echo '# ls /sys/block'; ls /sys/block; echo '# list-devices disk'; list-devices disk; echo '# ls -l /dev/vd* /dev/sd* /dev/nvme*'; ls -l /dev/vd* /dev/sd* /dev/nvme* 2>&1; echo '# lsmod (virtio/scsi/ata)'; lsmod | grep -E 'virtio|scsi|ata|sd_mod'; echo '# /proc/partitions'; cat /proc/partitions; } > /tmp/pxe-disk-diag.txt 2>&1; b=$(tr ' ' '\n' < /proc/cmdline | sed -n 's#^url=\(https\{0,1\}://.*/boot/52:54:00:99:00:11/[A-Za-z0-9_-]\{43\}/\)[^/]*$#\1#p' | head -n 1); if [ -n "$b" ] && [ -f /tmp/pxe-disk-diag.txt ]; then head -n 200 /tmp/pxe-disk-diag.txt | cut -c1-240 > /tmp/pxe-disk-diag.txt.cut; curl -fsS -m 15 --data-binary @/tmp/pxe-disk-diag.txt.cut -H 'Content-Type: text/plain' "${b}log" >/dev/null 2>&1 || wget -q -T 15 -O /dev/null --header='Content-Type: text/plain' --post-data="$(cat /tmp/pxe-disk-diag.txt.cut)" "${b}log" >/dev/null 2>&1 || true; fi; true; u=$(tr ' ' '\n' < /proc/cmdline | sed -n 's#^url=\(https\{0,1\}://.*/boot/52:54:00:99:00:11/[A-Za-z0-9_-]\{43\}/\)[^/]*$#\1status#p' | head -n 1); curl -fsS -m 15 --retry 5 --retry-delay 3 -X POST -d stage=failed "$u" >/dev/null 2>&1 || wget -q -T 15 -O /dev/null --post-data=stage=failed "$u" || true; exit 1; fi
