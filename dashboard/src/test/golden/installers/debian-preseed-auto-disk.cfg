d-i preseed/early_command string b=$(tr ' ' '\n' < /proc/cmdline | sed -n 's#^url=\(https\{0,1\}://.*/boot/52:54:00:99:00:11/[A-Za-z0-9_-]\{43\}/\)[^/]*$#\1#p' | head -n 1); if [ -n "$b" ]; then printf '%s\n' 'installer: preseed mulai' | curl -fsS -m 15 --data-binary @- -H 'Content-Type: text/plain' "${b}log" >/dev/null 2>&1 || wget -q -T 15 -O /dev/null --header='Content-Type: text/plain' --post-data='installer: preseed mulai' "${b}log" >/dev/null 2>&1 || true; fi; for m in virtio virtio_ring virtio_pci scsi_mod; do modprobe $m 2>/dev/null; done; for m in virtio_blk virtio_scsi; do [ -d "/sys/module/$m" ] || { wget -q -T 15 -O "/tmp/$m.ko" 'http://10.99.0.2/media/debian-netboot/modules'"/$(uname -r)/$m.ko" && insmod "/tmp/$m.ko"; }; done; udevadm settle --timeout=15 2>/dev/null || sleep 3; if [ -d /sys/module/virtio_blk ]; then b=$(tr ' ' '\n' < /proc/cmdline | sed -n 's#^url=\(https\{0,1\}://.*/boot/52:54:00:99:00:11/[A-Za-z0-9_-]\{43\}/\)[^/]*$#\1#p' | head -n 1); if [ -n "$b" ]; then printf '%s\n' 'installer: modul disk virtio dimuat' | curl -fsS -m 15 --data-binary @- -H 'Content-Type: text/plain' "${b}log" >/dev/null 2>&1 || wget -q -T 15 -O /dev/null --header='Content-Type: text/plain' --post-data='installer: modul disk virtio dimuat' "${b}log" >/dev/null 2>&1 || true; fi; fi
