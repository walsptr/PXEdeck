# /etc/dnsmasq.d/pxe.conf — DHCP + TFTP + DNS untuk jaringan provisioning (enp7s0)

# Hanya layani interface provisioning; bind-dynamic agar tetap jalan walau
# enp7s0 belum punya IP saat boot, dan tidak bentrok dengan systemd-resolved (127.0.0.53)
interface=enp7s0
except-interface=lo
bind-dynamic

# DNS forwarder untuk client PXE
no-resolv
server=192.168.122.1
server=1.1.1.1
domain=pxe.lab
local=/pxe.lab/

# DHCP
dhcp-authoritative
dhcp-range=enp7s0,10.10.10.100,10.10.10.200,255.255.255.0,12h
dhcp-option=option:router,10.10.10.1
dhcp-option=option:dns-server,10.10.10.1
dhcp-option=option:domain-name,pxe.lab

# Reservasi IP per node — di-generate oleh `pxe-nodes apply` dari /srv/pxe/nodes.csv
dhcp-hostsfile=/srv/pxe/dhcp-hosts

# Deteksi arsitektur client (DHCP option 93)
dhcp-match=set:efi-x86_64,option:client-arch,7
dhcp-match=set:efi-x86_64,option:client-arch,9
dhcp-match=set:bios,option:client-arch,0

# Bootloader: UEFI -> shim (Secure Boot OK) -> grub, BIOS -> pxelinux
dhcp-boot=tag:efi-x86_64,bootx64.efi,,10.10.10.1
dhcp-boot=tag:bios,pxelinux.0,,10.10.10.1

# TFTP
enable-tftp
tftp-root=/srv/pxe/tftp

log-dhcp
log-facility=/var/log/dnsmasq-pxe.log
