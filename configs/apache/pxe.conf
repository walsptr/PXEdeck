# /etc/apache2/conf-available/pxe.conf  (aktifkan: a2enconf pxe)
Alias /pxe /srv/pxe/http
<Directory /srv/pxe/http>
    Options +Indexes +FollowSymLinks
    AllowOverride None
    Require all granted
</Directory>

# User-data per node: /pxe/autoinstall/nodes/<mac>/{user-data,meta-data,vendor-data}
# (di-generate oleh pxe-nodes). MAC yang belum terdaftar -> file default di /pxe/autoinstall/.
<Directory /srv/pxe/http/autoinstall/nodes>
    RewriteEngine On
    RewriteCond %{REQUEST_FILENAME} !-f
    RewriteRule ^(?:[^/]*/)*(user-data|meta-data|vendor-data)$ /pxe/autoinstall/$1 [L]
</Directory>
