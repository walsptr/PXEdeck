#!/usr/sbin/nft -f
# /etc/nftables.conf — NAT agar node PXE (10.10.10.0/24) bisa akses internet lewat enp1s0
table ip pxe_nat
delete table ip pxe_nat
table ip pxe_nat {
    chain postrouting {
        type nat hook postrouting priority srcnat; policy accept;
        ip saddr 10.10.10.0/24 oifname "enp1s0" masquerade
    }
}
