# /srv/pxe/tftp/grub/grub.cfg — menu UEFI PXE
# user-data dipilih per MAC: /pxe/autoinstall/nodes/<mac>/ (MAC tak terdaftar -> fallback default, lihat apache/pxe.conf)
set timeout=10
set default=0

menuentry "Ubuntu 24.04.5 - Autoinstall (MENGHAPUS DISK!)" {
    set gfxpayload=keep
    echo "Loading kernel..."
    linux /ubuntu-24.04/vmlinuz ip=dhcp netboot=nfs nfsroot=10.10.10.1:/srv/pxe/nfs/ubuntu-24.04 autoinstall ds=nocloud-net\;s=http://10.10.10.1/pxe/autoinstall/nodes/${net_default_mac}/ cloud-config-url=/dev/null ---
    echo "Loading initrd..."
    initrd /ubuntu-24.04/initrd
}

menuentry "Ubuntu 24.04.5 - Install manual (interaktif)" {
    set gfxpayload=keep
    linux /ubuntu-24.04/vmlinuz ip=dhcp netboot=nfs nfsroot=10.10.10.1:/srv/pxe/nfs/ubuntu-24.04 cloud-config-url=/dev/null ---
    initrd /ubuntu-24.04/initrd
}

menuentry "Boot dari disk lokal" {
    exit 1
}
