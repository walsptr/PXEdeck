# /etc/nginx/sites-available/pxe (profil VLAN, M7) — listen di NIC admin pxe-test (10.99.0.2:80) DAN
# VLAN PXE pxe10 (10.99.10.2:80). TIDAK listen di 10.99.20.1 (mgmt20); node di VLAN 20 mencapai
# 10.99.10.2 lewat gateway 10.99.20.1 (= server, penerimaan lokal). Isi lokasi identik
# infra/server/nginx-pxe.conf (diasersi test infra); allowlist admin tetap PXE_ADMIN_ALLOW.
# Segmen token pada /boot/<mac>/<token>/... disamarkan di access log.
#
# M5 (DEC-015, mitigasi SR-4-1 sebelum login M6): UI dan /api/** hanya untuk IP admin
# (`allow <admin>; deny all`); /boot/** dan /media/** tetap terbuka untuk klien PXE.
# Baris `allow` bertanda `# PXE_ADMIN_ALLOW` diganti deploy-dashboard.sh dari env PXE_ADMIN_ALLOW
# (IPv4 atau CIDR IPv4, default 10.99.0.1 = host lab).
map $request_uri $pxe_log_uri {
    "~^(?<p>/boot/[^/]+/)[^/]+(?<r>/.*)$" "$p***$r";
    default $request_uri;
}
# M6 (DEC-017 §5, O5): limit_req sebagai LAPIS KEDUA (sumber kebenaran rate limit = aplikasi).
#  - login: 10 r/menit per IP, burst 5 nodelay. Kunci hanya terisi untuk $uri (sudah dinormalisasi
#    nginx: decode %XX, gabung //) = /api/auth/login; request lain berkunci "" = tidak dihitung.
#    Diterapkan di `location /` (allowlist admin yang sama) sehingga tidak ada lokasi /api terpisah.
#  - /boot/: 20 r/dtk per IP, burst 100 nodelay — longgar untuk installer (file konfigurasi, status,
#    log POST <= 60/menit/job), ketat terhadap banjir (SR-5-3). Nilai divalidasi run bulk KVM.
map $uri $pxe_login_key {
    "~^/api/auth/login/?$" $binary_remote_addr;
    default "";
}
limit_req_zone $pxe_login_key zone=pxe_login:1m rate=10r/m;
limit_req_zone $binary_remote_addr zone=pxe_boot:2m rate=20r/s;

log_format pxe '$remote_addr [$time_iso8601] "$request_method $pxe_log_uri" $status $body_bytes_sent "$http_user_agent"';

server {
    listen 10.99.0.2:80 default_server;
    listen 10.99.10.2:80 default_server;
    server_name _;
    access_log /var/log/nginx/pxe-access.log pxe;
    limit_req_status 429;
    limit_req_log_level warn;

    # Media instalasi (ISO ter-mount read-only) — statis, terbuka untuk klien PXE.
    location /media/ {
        alias /srv/pxe/media/;
        autoindex off;
    }

    # Endpoint boot (iPXE, file konfigurasi ber-token, callback/log installer) — terbuka untuk klien
    # PXE; otorisasi per-MAC/token/IP di dashboard (DEC-008/DEC-013). Script iPXE statis (smoke
    # test) bila ada; selain itu ke dashboard Next (127.0.0.1:3000).
    location /boot/ {
        limit_req zone=pxe_boot burst=100 nodelay;
        root /srv/pxe;
        default_type text/plain;
        try_files $uri @app;
    }

    # Log job SSE (`GET /api/jobs/:id/logs`): tanpa buffering/gzip, koneksi panjang. Allowlist admin.
    # Regex (bukan prefix `/api/jobs/`): location prefix berakhiran "/" dengan proxy_pass membuat
    # nginx membalas 301 untuk `/api/jobs` tanpa slash (ditemukan di smoke KVM M5).
    location ~ ^/api/jobs/[A-Za-z0-9_-]+/logs$ {
        allow 10.99.0.1; # PXE_ADMIN_ALLOW
        deny all;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Proto "";
        proxy_set_header X-Forwarded-Port "";
        proxy_set_header Forwarded "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        gzip off;
        client_max_body_size 1m;
    }

    # UI + /api/** lainnya: hanya IP admin (DEC-015). Akses ditolak sebelum try_files/@app.
    location / {
        allow 10.99.0.1; # PXE_ADMIN_ALLOW
        deny all;
        # Login admin: rate limit nginx (lihat map $pxe_login_key). limit_req berjalan di fase
        # preaccess (sebelum allow/deny), jadi IP non-admin yang membanjiri login juga dibatasi.
        limit_req zone=pxe_login burst=5 nodelay;
        try_files /nonexistent @app;
    }

    location @app {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # IP klien hanya dari X-Real-IP (PXE_TRUST_PROXY=1); header forwarding dari klien dibuang
        # (nilai kosong = header tidak diteruskan) agar tidak bisa dipalsukan.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Proto "";
        proxy_set_header X-Forwarded-Port "";
        proxy_set_header Forwarded "";
        proxy_buffering off;
        client_max_body_size 1m;
    }
}
