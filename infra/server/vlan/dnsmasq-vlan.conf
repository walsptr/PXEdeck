# /etc/dnsmasq.d/pxe.conf (profil VLAN, M7) — DHCP + TFTP + DNS VM pxe-test-server HANYA di pxe10
# (VLAN 10, 10.99.10.2). Segmen admin (pxe0), VLAN management (mgmt20), NAT (nat0) dan lo
# dikecualikan; DHCP tidak dilayani di pxe0/mgmt20 (DEC-023 §3). Diverifikasi verify-listen-vlan.sh.
interface=pxe10
bind-interfaces
except-interface=lo,nat0,pxe0,mgmt20
no-dhcp-interface=pxe0,mgmt20
no-resolv
domain=pxe.test
local=/pxe.test/

dhcp-authoritative
dhcp-range=pxe10,10.99.10.100,10.99.10.200,255.255.255.0,1h
# Tanpa opsi router: VLAN PXE tidak punya gateway (node hanya butuh 10.99.10.2 di subnet yang sama).
dhcp-option=3
dhcp-option=option:dns-server,10.99.10.2
dhcp-leasefile=/var/lib/misc/dnsmasq.leases

# client-arch (opsi 93): 7/9 = EFI x86-64; selain itu BIOS.
dhcp-userclass=set:ipxe,iPXE
dhcp-match=set:efi64,option:client-arch,7
dhcp-match=set:efi64,option:client-arch,9
# iPXE -> script per-MAC via HTTP (nginx -> dashboard) di alamat VLAN PXE.
dhcp-boot=tag:ipxe,http://10.99.10.2/boot/${mac}.ipxe?platform=${platform}
dhcp-boot=tag:!ipxe,tag:efi64,snponly.efi,,10.99.10.2
dhcp-boot=tag:!ipxe,tag:!efi64,undionly.kpxe,,10.99.10.2

enable-tftp
tftp-root=/srv/pxe/tftp

log-dhcp
log-queries
log-facility=/var/log/dnsmasq-pxe.log
