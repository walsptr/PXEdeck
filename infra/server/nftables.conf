#!/usr/sbin/nft -f
# Tolak semua koneksi masuk baru dari NIC NAT (nat0); NIC pxe0 tidak dibatasi.
flush ruleset
table inet pxe_guard {
    chain input {
        type filter hook input priority 0; policy accept;
        iifname "nat0" ct state established,related accept
        iifname "nat0" icmp type echo-request accept
        iifname "nat0" counter drop
    }
}
