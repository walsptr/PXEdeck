# /etc/dnsmasq.d/pxe.conf — DHCP + TFTP + DNS untuk VM pxe-test-server.
# HANYA di NIC pxe0 (network libvirt pxe-test, 10.99.0.2). NIC NAT (nat0) dan lo dikecualikan.
interface=pxe0
bind-interfaces
except-interface=lo
except-interface=nat0
no-resolv
domain=pxe.test
local=/pxe.test/

dhcp-authoritative
dhcp-range=pxe0,10.99.0.100,10.99.0.200,255.255.255.0,1h
dhcp-option=option:router,10.99.0.1
dhcp-option=option:dns-server,10.99.0.2
dhcp-leasefile=/var/lib/misc/dnsmasq.leases

# client-arch (opsi 93): 7/9 = EFI x86-64; selain itu BIOS.
dhcp-userclass=set:ipxe,iPXE
dhcp-match=set:efi64,option:client-arch,7
dhcp-match=set:efi64,option:client-arch,9
# iPXE (ROM QEMU / snponly.efi / undionly.kpxe) -> script per-MAC via HTTP (nginx -> dashboard).
# ${mac} dan ${platform} diekspansi oleh iPXE, bukan dnsmasq.
dhcp-boot=tag:ipxe,http://10.99.0.2/boot/${mac}.ipxe?platform=${platform}
dhcp-boot=tag:!ipxe,tag:efi64,snponly.efi,,10.99.0.2
dhcp-boot=tag:!ipxe,tag:!efi64,undionly.kpxe,,10.99.0.2

enable-tftp
tftp-root=/srv/pxe/tftp

log-dhcp
log-queries
log-facility=/var/log/dnsmasq-pxe.log
